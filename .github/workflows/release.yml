name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the tag to match the extension version
        shell: bash
        run: |
          set -euo pipefail
          extension_version="$(awk -F"'" \
            '/^[[:space:]]*default_version[[:space:]]*=/{print $2; exit}' \
            pg_accel/pg_accel.control)"
          if [ -z "$extension_version" ]; then
            echo "error: pg_accel.control has no default_version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v${extension_version}" ]; then
            echo "error: release tag $GITHUB_REF_NAME does not match extension version v${extension_version}" >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }}, PG ${{ matrix.pg }})
    needs: validate-tag
    env:
      # ACPP_REQUIRED_SHA is loaded from the repo-root .acpp-version file (single
      # source of truth shared with scripts/setup_acpp.sh and ci.yml) by the
      # "Load pinned AdaptiveCpp SHA" step below; do not hardcode it here.
      SOFT_FP64_REQUIRED_TAG: v2.0.1
    strategy:
      fail-fast: false
      matrix:
        # Qualified Metal release packaging runs on macOS. The independent
        # generic Linux package matrix below validates the Linux artifacts.
        os: [macos-26]
        pg: [18, 19]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned AdaptiveCpp SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "ACPP_REQUIRED_SHA=$(cat .acpp-version)" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rust_version="$(awk '/^rust / { print $2 }' .tool-versions)"
          rustup toolchain install "$rust_version" --profile minimal
          rustup default "$rust_version"
      - name: Validate pgrx support for PostgreSQL ${{ matrix.pg }}
        id: pg-support
        shell: bash
        run: |
          set -euo pipefail
          source scripts/pg_versions.sh
          pg_accel_require_pgrx_support "${{ matrix.pg }}"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        if: steps.pg-support.outputs.skip != 'true'
      - name: Install macOS build dependencies
        if: steps.pg-support.outputs.skip != 'true'
        run: |
          brew update
          brew install just cmake llvm@20 lld@20 boost libomp postgis
      - name: Build pinned AdaptiveCpp Metal toolchain
        if: steps.pg-support.outputs.skip != 'true'
        run: |
          just setup-gpu-metal-headers
          ACPP_BACKEND=metal \
            LLVM_PREFIX="$(brew --prefix llvm@20)" \
            ACPP_LLD_PATH="$(brew --prefix lld@20)/bin/ld64.lld" \
            just setup-gpu-acpp
      - name: Build kernels before CPU-cheat release gate
        if: steps.pg-support.outputs.skip != 'true'
        run: just gpu-build
      - name: Audit safety and deterministic fuzz contracts
        if: steps.pg-support.outputs.skip != 'true' && matrix.pg == 18
        run: just safety-contract-audit
      - name: Run CPU-cheat release gate
        if: steps.pg-support.outputs.skip != 'true'
        run: CPU_CHEAT_AUDIT_REPORT=target/cpu-cheat-audit.json just audit-cpu-cheats
      - if: steps.pg-support.outputs.skip != 'true'
        run: |
          source scripts/pg_versions.sh
          cargo install cargo-pgrx --locked --version "$PG_ACCEL_PGRX_VERSION"
      - if: steps.pg-support.outputs.skip != 'true'
        run: |
          scripts/pg_source.sh build ${{ matrix.pg }}
          cargo pgrx init --pg${{ matrix.pg }} "$(scripts/pg_source.sh pg-config ${{ matrix.pg }})"
      - if: steps.pg-support.outputs.skip != 'true'
        run: |
          python3 scripts/package_extension.py \
            --pg "${{ matrix.pg }}" \
            --pg-config "$(scripts/pg_source.sh pg-config ${{ matrix.pg }})" \
            --acpp-prefix "$PWD/.pgaccel/acpp/current"
      - name: Verify extracted macOS package in an isolated PostgreSQL cluster
        if: steps.pg-support.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          just package-smoke "${{ matrix.pg }}"
      - name: Upload artifacts
        if: steps.pg-support.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pg_accel-pg${{ matrix.pg }}-${{ matrix.os }}
          path: |
            target/release/pg_accel-pg${{ matrix.pg }}-*.tar.gz
            target/release/pg_accel-pg${{ matrix.pg }}-*.tar.gz.sha256
            target/release/pg_accel-pg${{ matrix.pg }}-*.smoke.txt
          if-no-files-found: error

  linux-package:
    name: Linux generic package (PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    needs: validate-tag
    timeout-minutes: 180
    env:
      SOFT_FP64_REQUIRED_TAG: v2.0.1
    strategy:
      fail-fast: false
      matrix:
        pg: [18, 19]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load pinned AdaptiveCpp SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "ACPP_REQUIRED_SHA=$(cat .acpp-version)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rust_version="$(awk '/^rust / { print $2 }' .tool-versions)"
          rustup toolchain install "$rust_version" --profile minimal
          rustup default "$rust_version"

      - name: Validate pgrx support for PostgreSQL ${{ matrix.pg }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/pg_versions.sh
          pg_accel_require_pgrx_support "${{ matrix.pg }}"

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: release-cargo-linux-${{ runner.arch }}-pg${{ matrix.pg }}-${{ hashFiles('Cargo.lock', '.tool-versions') }}
          restore-keys: |
            release-cargo-linux-${{ runner.arch }}-pg${{ matrix.pg }}-
            release-cargo-linux-${{ runner.arch }}-

      - name: Cache AdaptiveCpp generic install
        id: cache-acpp-linux-release
        uses: actions/cache@v4
        with:
          path: |
            .pgaccel/acpp
            .pgaccel/src/AdaptiveCpp
            .pgaccel/src/soft-fp64
          key: release-acpp-linux-${{ runner.arch }}-${{ env.ACPP_REQUIRED_SHA }}-${{ env.SOFT_FP64_REQUIRED_TAG }}-${{ hashFiles('.acpp-version', 'patches/adaptivecpp/*.patch', 'scripts/setup_acpp.sh') }}

      - name: Cache source PostgreSQL
        uses: actions/cache@v4
        with:
          path: |
            ~/.pgrx
            .pgaccel/postgres
          key: release-source-pg-linux-${{ runner.arch }}-pg${{ matrix.pg }}-${{ hashFiles('scripts/pg_source.sh') }}

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            bison \
            clang \
            cmake \
            curl \
            flex \
            git \
            libclang-dev \
            libomp-dev \
            libreadline-dev \
            libssl-dev \
            lld \
            llvm-dev \
            ninja-build \
            pkg-config \
            zlib1g-dev

      - name: Install build tools and initialize PostgreSQL ${{ matrix.pg }}
        shell: bash
        run: |
          set -euo pipefail
          source scripts/pg_versions.sh
          cargo install just --locked
          cargo install cargo-pgrx --version "$PG_ACCEL_PGRX_VERSION" --locked
          scripts/pg_source.sh build "${{ matrix.pg }}"
          cargo pgrx init --pg${{ matrix.pg }} "$(scripts/pg_source.sh pg-config "${{ matrix.pg }}")"

      - name: Build pinned AdaptiveCpp generic toolchain
        if: steps.cache-acpp-linux-release.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ACPP_BACKEND=generic ./scripts/setup_acpp.sh

      - name: Build and audit release candidate
        shell: bash
        run: |
          set -euo pipefail
          just gpu-build
          just safety-contract-audit
          CPU_CHEAT_AUDIT_REPORT=target/cpu-cheat-audit-linux-pg${{ matrix.pg }}.json \
            just audit-cpu-cheats

      - name: Build validated Linux release archive
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package_extension.py \
            --pg "${{ matrix.pg }}" \
            --pg-config "$(scripts/pg_source.sh pg-config "${{ matrix.pg }}")" \
            --acpp-prefix "$PWD/.pgaccel/acpp/current"

      - name: Verify extracted installer in an isolated PostgreSQL cluster
        shell: bash
        run: |
          set -euo pipefail
          just package-smoke "${{ matrix.pg }}"

      - name: Upload Linux release archive
        uses: actions/upload-artifact@v4
        with:
          name: pg_accel-pg${{ matrix.pg }}-ubuntu-generic-${{ runner.arch }}
          path: |
            target/release/pg_accel-pg${{ matrix.pg }}-linux-*.tar.gz
            target/release/pg_accel-pg${{ matrix.pg }}-linux-*.tar.gz.sha256
            target/release/pg_accel-pg${{ matrix.pg }}-*.smoke.txt
          if-no-files-found: error

  metal-coverage:
    name: Qualified Metal release gates (PG 18)
    runs-on: macos-26
    needs: validate-tag
    timeout-minutes: 360
    env:
      SOFT_FP64_REQUIRED_TAG: v2.0.1
    steps:
      - uses: actions/checkout@v4

      - name: Load pinned AdaptiveCpp SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "ACPP_REQUIRED_SHA=$(cat .acpp-version)" >> "$GITHUB_ENV"

      - name: Install Rust and coverage tooling
        shell: bash
        run: |
          set -euo pipefail
          source scripts/pg_versions.sh
          rust_version="$(awk '/^rust / { print $2 }' .tool-versions)"
          rustup toolchain install "$rust_version" --profile minimal --component llvm-tools-preview
          rustup default "$rust_version"
          cargo install cargo-pgrx --version "$PG_ACCEL_PGRX_VERSION" --locked
          cargo install cargo-llvm-cov --locked

      - name: Install qualified Metal dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install just cmake llvm@20 lld@20 boost libomp postgis

      - name: Cache qualified Metal toolchain
        id: cache-acpp-metal-release
        uses: actions/cache@v4
        with:
          path: |
            .pgaccel/acpp
            .pgaccel/src/AdaptiveCpp
            .pgaccel/src/soft-fp64
          key: acpp-qualified-metal-${{ runner.arch }}-${{ env.ACPP_REQUIRED_SHA }}-${{ env.SOFT_FP64_REQUIRED_TAG }}-${{ hashFiles('.acpp-version', 'patches/adaptivecpp/*.patch', 'scripts/setup_acpp.sh') }}

      - name: Build pinned AdaptiveCpp Metal toolchain
        if: steps.cache-acpp-metal-release.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          just setup-gpu-metal-headers
          ACPP_BACKEND=metal \
            LLVM_PREFIX="$(brew --prefix llvm@20)" \
            ACPP_LLD_PATH="$(brew --prefix lld@20)/bin/ld64.lld" \
            just setup-gpu-acpp

      - name: Initialize PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          just setup-pg-source 18
          just setup-pg-extensions 18
          just setup-pgrx 18

      - name: Run release coverage gate
        shell: bash
        env:
          COVERAGE_ARTIFACT_DIR: artifacts/coverage-pg18-qualified-metal
          COVERAGE_MIN_RUST_LINES: 90
          COVERAGE_MIN_CPP_LINES: 90
          COVERAGE_MIN_SQL_ASSERTIONS: 90
        run: |
          set -euo pipefail
          CPP_COVERAGE_LLVM_PREFIX="$(brew --prefix llvm@20)" just coverage 18

      - name: Remove coverage build intermediates
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/coverage

      - name: Run mandatory warm Metal benchmark ship gate
        shell: bash
        run: |
          set -euo pipefail
          just metal-warm-benchmark-ship-gate 18 artifacts/warm-benchmark-ship-gate-pg18-qualified-metal

      - name: Run weighted global-count benchmark ship gate
        shell: bash
        run: |
          set -euo pipefail
          just weighted-count-benchmark-ship-gate 18 artifacts/weighted-count-ship-gate-pg18-qualified-metal

      - name: Run broad system workload characterization
        shell: bash
        run: |
          set -euo pipefail
          just system-workload-gate 18 artifacts/system-workload-gate-pg18-qualified-metal

      - name: Run live Metal stress gate
        shell: bash
        env:
          METAL_STRESS_ARTIFACT_DIR: artifacts/metal-stress-pg18-qualified-metal
        run: |
          set -euo pipefail
          just metal-stress 18

      - name: Run native-decline parity gate
        shell: bash
        env:
          NATIVE_PARITY_ARTIFACT_DIR: artifacts/native-parity-p0-pg18-qualified-metal
        run: |
          set -euo pipefail
          just native-parity-p0 "$NATIVE_PARITY_ARTIFACT_DIR" "postgresql://localhost:28818/postgres" 18

      - name: Upload release coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-accel-release-three-layer-coverage-pg18-qualified-metal
          path: artifacts/coverage-pg18-qualified-metal
          if-no-files-found: error

      - name: Upload release warm Metal benchmark ship-gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-accel-release-warm-benchmark-ship-gate-pg18-qualified-metal
          path: artifacts/warm-benchmark-ship-gate-pg18-qualified-metal
          if-no-files-found: error

      - name: Upload release weighted global-count ship-gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-accel-release-weighted-count-ship-gate-pg18-qualified-metal
          path: artifacts/weighted-count-ship-gate-pg18-qualified-metal
          if-no-files-found: error

      - name: Upload release broad system workload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-accel-release-system-workload-gate-pg18-qualified-metal
          path: artifacts/system-workload-gate-pg18-qualified-metal
          if-no-files-found: error

      - name: Upload release Metal stress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-accel-release-metal-stress-pg18-qualified-metal
          path: artifacts/metal-stress-pg18-qualified-metal
          if-no-files-found: error

      - name: Upload release native-decline parity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-accel-release-native-parity-p0-pg18-qualified-metal
          path: artifacts/native-parity-p0-pg18-qualified-metal
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, linux-package, metal-coverage]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Package qualified Metal evidence for durable release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          evidence_count=0
          while IFS= read -r artifact_dir; do
            [ -n "$artifact_dir" ] || continue
            artifact_name="$(basename "$artifact_dir")"
            tar -C release-artifacts -czf "release-evidence/${artifact_name}.tar.gz" "$artifact_name"
            (cd release-evidence && sha256sum "${artifact_name}.tar.gz" \
              > "${artifact_name}.tar.gz.sha256")
            evidence_count=$((evidence_count + 1))
          done < <(find release-artifacts -mindepth 1 -maxdepth 1 -type d \
            -name 'pg-accel-release-*-pg18-qualified-metal' -print | LC_ALL=C sort)
          if [ "$evidence_count" -ne 6 ]; then
            echo "error: expected six qualified-Metal evidence bundles, found $evidence_count" >&2
            exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-artifacts/pg_accel-pg*/*.tar.gz
            release-artifacts/pg_accel-pg*/*.tar.gz.sha256
            release-artifacts/pg_accel-pg*/pg_accel-pg*.smoke.txt
            release-evidence/*.tar.gz
            release-evidence/*.tar.gz.sha256
