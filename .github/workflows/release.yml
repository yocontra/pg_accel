name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }}, PG ${{ matrix.pg }})
    env:
      ACPP_REQUIRED_SHA: 4f3cde11a302eebac28aa1ccc79ad3399cb8183c
      SOFT_FP64_REQUIRED_TAG: v1.3.0
    strategy:
      matrix:
        # pg_accel is currently a Metal/macOS-only GPU extension. Linux/CUDA
        # support requires building AdaptiveCpp + a CUDA backend in CI, which
        # is not yet wired up. Restrict release builds to macOS for now.
        os: [macos-26]
        pg: [15, 16, 17, 18]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install just cmake llvm@20 lld@20 boost libomp
      - name: Build pinned AdaptiveCpp Metal toolchain
        run: |
          just setup-gpu-metal-headers
          just setup-gpu-acpp
      - run: cargo install cargo-pgrx --locked --version '~0.17'
      - run: cargo pgrx init --pg${{ matrix.pg }} download
      - run: |
          cargo pgrx package --package pg_accel --pg-config ~/.pgrx/${{ matrix.pg }}.*/pgrx-install/bin/pg_config --features pg${{ matrix.pg }}
          cp NOTICE target/release/pg_accel-pg${{ matrix.pg }}/NOTICE
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pg_accel-pg${{ matrix.pg }}-${{ matrix.os }}
          path: target/release/pg_accel-pg${{ matrix.pg }}/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/pg_accel-pg*/**
