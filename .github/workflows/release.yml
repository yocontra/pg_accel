name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }}, PG ${{ matrix.pg }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
        pg: [15, 16, 17, 18]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-pgrx --locked --version '~0.17'
      - run: cargo pgrx init --pg${{ matrix.pg }} download
      - run: cargo pgrx package --pg-config ~/.pgrx/${{ matrix.pg }}.*/pgrx-install/bin/pg_config
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pg_accel-${{ matrix.os }}-pg${{ matrix.pg }}
          path: target/release/pg_accel-pg${{ matrix.pg }}/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            pg_accel-pg*/**
