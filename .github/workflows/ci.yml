name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  test-unit:
    name: Test (PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        pg: [17]  # Start with 17, expand in Phase 9
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-pgrx --locked
      - run: cargo pgrx init --pg${{ matrix.pg }} download
      - run: cargo pgrx test pg${{ matrix.pg }}

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-pgrx --locked
      - run: cargo pgrx init --pg17 download
      - run: cargo pgrx package --pg-config ~/.pgrx/17.*/pgrx-install/bin/pg_config
      - run: docker compose -f docker/docker-compose.test.yml up -d --wait
      - run: docker/scripts/run_integration_tests.sh
      - run: docker compose -f docker/docker-compose.test.yml down -v
        if: always()

  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if ! echo "$TITLE" | grep -qE '^(feat|fix|perf|refactor|test|docs|ci|chore|build|style)(\(.+\))?!?:'; then
            echo "PR title must follow Conventional Commits: type(scope): description"
            echo "Got: $TITLE"
            exit 1
          fi
