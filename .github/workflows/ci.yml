name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings

  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  test-unit:
    name: Test (${{ matrix.os }}, PG ${{ matrix.pg }})
    needs: [lint]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
        pg: [17]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-pgrx --locked --version '~0.17'
      - run: cargo pgrx init --pg${{ matrix.pg }} download
      - run: cargo pgrx test pg${{ matrix.pg }}

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-pgrx --locked --version '~0.17'
      - run: cargo pgrx init --pg17 download
      - run: cargo pgrx package --pg-config ~/.pgrx/17.*/pgrx-install/bin/pg_config
      - run: docker compose -f docker/docker-compose.test.yml up -d --wait
      - run: docker/scripts/run_integration_tests.sh
      - run: docker compose -f docker/docker-compose.test.yml down -v
        if: always()

  gpu-kernels:
    name: GPU Kernels (CPU emulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd pgaccel-kernels
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if ! echo "$TITLE" | grep -qE '^(feat|fix|perf|refactor|test|docs|ci|chore|build|style)(\(.+\))?!?:'; then
            echo "PR title must follow Conventional Commits: type(scope): description"
            echo "Got: $TITLE"
            exit 1
          fi
