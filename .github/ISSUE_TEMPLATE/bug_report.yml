name: Bug Report
description: Report a bug in pg_accel
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: SQL queries or commands that trigger the bug
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Paste output of:
        - SELECT * FROM pg_accel_device_info();
        - SELECT * FROM pg_accel_device_limits() ORDER BY name;
        - SELECT * FROM pg_accel_resident_status();
        - SELECT pg_accel_resident_live_bytes();
        - SELECT * FROM pg_accel_stats();
        - SELECT * FROM pg_accel_gpu_failures();
        - SELECT pg_accel_last_planner_rejection_reason();
        - SELECT version();
        - SELECT postgis_version(); (if applicable)
        - SELECT name, setting, unit, context, source FROM pg_settings WHERE name LIKE 'pg_accel.%' AND name NOT LIKE 'pg_accel.test_%' ORDER BY name;

        Run these in the same backend/session as the reproduction. Do not enable
        a pg_accel.test_* GUC for a production bug report.
    validations:
      required: true
