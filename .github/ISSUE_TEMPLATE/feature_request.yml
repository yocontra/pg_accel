name: Feature Request
description: Suggest a new feature for pg_accel
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What feature would you like to see?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the problem this feature would solve or the workflow it would improve.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you have considered.
    validations:
      required: false
  - type: textarea
    id: capability-layer
    attributes:
      label: Capability layer
      description: Which layers exist and which are requested (SQL/catalog contract, adapter registration, planner path, resident proof, executor/bridge, device kernel, EXPLAIN, correctness tests, or benchmarks)? A kernel or adapter entry alone is not production planner support.
    validations:
      required: true
