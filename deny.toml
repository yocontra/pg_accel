[licenses]
# Explicit allow list. Any license NOT listed here is denied by default
# (cargo-deny schema v2+: there is no separate `deny = [...]` field — unlisted
# licenses fail the check). See NOTICE for attribution of bundled binaries.
#
# Required by bundled binary artifacts (see NOTICE for full attribution):
#   MIT           — soft-fp64, pgrx (dual), majority of transitive crates
#   BSD-2-Clause  — AdaptiveCpp runtime + compiler toolchain
#   BSL-1.0       — SLEEF transcendental bodies (Boost Software License 1.0)
#   PostgreSQL    — PostgreSQL headers (build-time FFI)
#   Apache-2.0    — pgrx (dual), many transitive crates
#
# Other entries cover transitive deps flagged by `cargo deny list`.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "PostgreSQL",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
ignore = [
  { id = "RUSTSEC-2021-0127", reason = "Unmaintained crate pulled in transitively by pgrx; reassess when pgrx updates its dependency tree." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
