[package]
name = "pg_accel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
# pg_accel is a pgrx extension that builds the sibling pgaccel-kernels CMake
# project. Publish release artifacts through the pgrx package/release workflow;
# a standalone crates.io package would be missing that repo-level source tree.
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pgrx_embed_pg_accel"
path = "./src/bin/pgrx_embed.rs"

[features]
# Repo-level tooling targets PostgreSQL 17 by default. The pg18 feature is kept
# visible for ABI cleanup work, but PG18 is not the default until all executor
# bindings are ported to PostgreSQL 18's tuple descriptor and planner changes.
default = ["pg17"]
pg17 = ["pgrx/pg17"]
pg18 = ["pgrx/pg18"]
# Add `pg19 = ["pgrx/pg19"]` here when pgrx exposes that feature; the
# scripts/pg_versions.sh matrix will begin exercising it automatically.
pg_test = []

[dependencies]
libc = "0.2"
pgrx = "0.17.0"
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry_sdk = { version = "0.31", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = [
  "fmt",
  "env-filter",
  "json",
] }

[dev-dependencies]
pgrx-tests = "0.17.0"

[build-dependencies]

[lints]
workspace = true
