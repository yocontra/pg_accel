[workspace]
members = ["pg_accel", "pg_accel_bench"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "PostgreSQL"
authors = ["Eric Schoffstall"]
description = "GPU-accelerated PostgreSQL extension: spatial predicates, h3 cell ops, raster ops, and batched executor nodes via Custom Scan Provider."
repository = "https://github.com/pg-accel/pg_accel"
homepage = "https://github.com/pg-accel/pg_accel"
keywords = ["postgres", "postgresql", "gpu", "postgis", "h3"]
categories = ["database"]
readme = "README.md"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
# expect() is allowed — it carries context. unwrap_used catches the dangerous case.
expect_used = "allow"
nursery = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_const_for_fn = "allow"
# PostgreSQL Datum ↔ Rust conversions require platform-dependent casts.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
