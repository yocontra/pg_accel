services:
  postgres:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    ports:
      - "5488:5432"
    shm_size: 2g
    environment:
      POSTGRES_PASSWORD: pgaccel_test
      POSTGRES_DB: pgaccel_shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./fixtures:/docker-entrypoint-initdb.d/fixtures
      - ./init:/docker-entrypoint-initdb.d/init
