services:
  pgaccel-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    ports:
      - "5488:5432"
    shm_size: 2g
    environment:
      POSTGRES_PASSWORD: pgaccel_test
      POSTGRES_DB: pgaccel_shared
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./tests:/opt/pg_accel/tests:ro
    # Init scripts and fixtures are baked into the image via Dockerfile.test.
    # They run in sorted order on first startup (see Dockerfile.test for ordering).
